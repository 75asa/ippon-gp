# RTDB セキュリティルール（firebase/database.rules.json）をエミュレータで検証する。
# ケースは tests/rules/test-rules.mjs。手元で動かす方法は docs/SECURITY_RULES.md を参照。
# firebase-tools のバージョンによってエミュレータの名前空間が変わる（demo-ippon-default-rtdb など）ため、
# --load-rules でテストが使う名前空間（demo-ippon）にルールを直接読み込む。
name: Test RTDB rules

on:
  pull_request:
    # ready_for_review: draft の PR では動かさない（Actions の分を節約）
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "firebase/**"
      - "tests/rules/**"
      - "firebase.json"
      - ".github/workflows/test-rules.yml"
  push:
    branches: [main]
    paths:
      - "firebase/**"
      - "tests/rules/**"
      - "firebase.json"
  workflow_dispatch:

permissions:
  contents: read

# 同じ ref の古い実行は、新しい push で打ち切る
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rules:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # RTDB エミュレータは Java で動く
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      # エミュレータの jar（数十 MB）を毎回ダウンロードしない。firebase-tools を上げたらキーも変える
      - uses: actions/cache@v6
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-15.31.0
      - name: Run rules tests on the emulator
        run: npx --yes firebase-tools@15.31.0 emulators:exec --only database --project demo-ippon "node tests/rules/test-rules.mjs --load-rules"

<!DOCTYPE html>
<!-- README 冒頭のメイン画像（1600×640）。scripts/render-images.sh で docs/images/hero.png に書き出す -->
<html lang="ja">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Zen+Kaku+Gothic+New:wght@500;700;900&display=block" rel="stylesheet">
<link rel="stylesheet" href="common.css">
<style>
body { width: 1600px; height: 640px; }
.stage {
  position: relative; width: 100%; height: 100%; overflow: hidden;
  background:
    radial-gradient(ellipse 60% 80% at 72% 45%, rgba(204,0,255,0.28), transparent 70%),
    radial-gradient(ellipse 40% 50% at 8% 100%, rgba(255,149,0,0.14), transparent 70%),
    var(--ink);
}
.stage::before { /* スポットライト */
  content: ''; position: absolute; left: 1010px; top: -200px; width: 260px; height: 900px;
  background: linear-gradient(180deg, rgba(255,255,255,0.10), transparent 75%);
  transform: rotate(18deg); filter: blur(20px);
}
.stage::after {
  content: ''; position: absolute; left: 1150px; top: -200px; width: 220px; height: 900px;
  background: linear-gradient(180deg, rgba(204,0,255,0.16), transparent 75%);
  transform: rotate(-16deg); filter: blur(24px);
}

/* 左: タイトル */
.copy { position: absolute; left: 96px; top: 0; bottom: 0; width: 640px; display: flex; flex-direction: column; justify-content: center; z-index: 2; }
.kicker { font-size: 20px; font-weight: 900; letter-spacing: 6px; color: var(--magenta-soft); }
.title { font-family: 'Bebas Neue', sans-serif; font-size: 184px; line-height: 0.86; letter-spacing: 6px; color: #fff; margin-top: 18px; }
.title span { color: var(--magenta); text-shadow: 0 0 40px rgba(204,0,255,0.6); }
.lead { font-size: 22px; font-weight: 700; line-height: 1.75; color: rgba(255,255,255,0.78); margin-top: 26px; }
.chips { display: flex; gap: 10px; margin-top: 30px; }

/* 右: 会場の構成図 */
.venue { position: absolute; left: 820px; top: 64px; width: 700px; height: 520px; z-index: 2; }
.screen {
  position: absolute; left: 110px; top: 0; width: 480px; height: 270px;
  border-radius: 14px; background: #0a0012; border: 3px solid rgba(255,255,255,0.14);
  box-shadow: 0 0 0 10px rgba(255,255,255,0.03), 0 30px 80px rgba(204,0,255,0.35);
  overflow: hidden;
}
.screen-label { position: absolute; left: 14px; top: 10px; font-family: 'Bebas Neue'; font-size: 18px; letter-spacing: 3px; color: rgba(255,255,255,0.45); }
.screen-cam { /* カメラ映像のシルエット */
  position: absolute; inset: 0;
  background: radial-gradient(circle at 50% 115%, rgba(0,221,170,0.22) 0 34%, transparent 35%),
              radial-gradient(circle at 50% 50%, rgba(0,221,170,0.18) 0 12%, transparent 13%);
}
.meter { position: absolute; left: 36px; right: 36px; bottom: 26px; display: flex; gap: 8px; }
.meter i { flex: 1; height: 16px; border-radius: 4px; background: var(--magenta); box-shadow: 0 0 16px rgba(204,0,255,0.9); }
.ippon {
  position: absolute; left: 0; right: 0; top: 56px; text-align: center;
  font-family: 'Bebas Neue'; font-size: 132px; letter-spacing: 10px; line-height: 1;
  color: #fff; text-shadow: 0 0 24px var(--magenta), 0 0 60px var(--magenta);
  transform: rotate(-4deg);
}
.burst { position: absolute; left: 50%; top: 42%; width: 520px; height: 520px; transform: translate(-50%, -50%);
  background: repeating-conic-gradient(rgba(204,0,255,0.20) 0 6deg, transparent 6deg 18deg);
  -webkit-mask: radial-gradient(circle, #000 0 30%, transparent 62%); mask: radial-gradient(circle, #000 0 30%, transparent 62%);
}

/* 審査員スマホ ×10（6 票で IPPON） */
.judges { position: absolute; left: 70px; top: 362px; width: 560px; display: flex; justify-content: space-between; }
.phone { width: 40px; height: 70px; border-radius: 9px; border: 2px solid rgba(221,184,255,0.35); background: rgba(221,184,255,0.06); position: relative; }
.phone::after { content: ''; position: absolute; left: 50%; top: 50%; width: 18px; height: 18px; border-radius: 50%; transform: translate(-50%,-50%); background: rgba(221,184,255,0.18); }
.phone.on { border-color: var(--magenta); background: rgba(204,0,255,0.18); box-shadow: 0 0 18px rgba(204,0,255,0.55); }
.phone.on::after { background: var(--magenta); box-shadow: 0 0 12px var(--magenta); }
.judges-label { position: absolute; left: 70px; top: 448px; width: 560px; text-align: center; }

/* HOST / CAM */
.device { position: absolute; width: 104px; padding: 12px 0 10px; border-radius: 16px; text-align: center; color: #fff; }
.device b { display: block; font-family: 'Bebas Neue'; font-size: 30px; letter-spacing: 2px; line-height: 1; }
.device small { display: block; font-size: 12px; font-weight: 700; opacity: 0.85; margin-top: 4px; }
.host { left: -24px; top: 92px; background: linear-gradient(150deg, var(--orange), #cc5500); box-shadow: 0 16px 40px rgba(255,149,0,0.3); }
.cam  { left: 620px; top: 92px; background: linear-gradient(150deg, var(--teal), #0099cc); box-shadow: 0 16px 40px rgba(0,221,170,0.3); }

.wires { position: absolute; inset: 0; pointer-events: none; }
.wires path { fill: none; stroke-width: 2; stroke-dasharray: 3 7; stroke-linecap: round; }
.label { font-size: 14px; font-weight: 700; letter-spacing: 2px; color: rgba(255,255,255,0.5); }
</style>
</head>
<body>
<div class="stage">
  <div class="copy">
    <div class="kicker">大喜利王決定戦 採点システム</div>
    <div class="title">IPPON<br><span>GP</span></div>
    <div class="lead">プロジェクター・司会・審査員のスマホ・カメラを<br>リアルタイムに同期して、番組さながらの採点演出を。</div>
    <div class="chips">
      <span class="chip main">MAIN</span><span class="chip host">HOST</span><span class="chip judge">JUDGE</span><span class="chip cam">CAM</span>
    </div>
  </div>

  <div class="venue">
    <svg class="wires" viewBox="0 0 700 520">
      <!-- JUDGE → MAIN -->
      <path d="M 350 360 L 350 272" stroke="rgba(204,0,255,0.7)"/>
      <!-- HOST → MAIN -->
      <path d="M 80 135 L 110 135" stroke="rgba(255,149,0,0.8)"/>
      <!-- CAM → MAIN -->
      <path d="M 620 135 L 590 135" stroke="rgba(0,221,170,0.8)"/>
    </svg>
    <div class="screen">
      <div class="screen-cam"></div>
      <div class="burst"></div>
      <div class="screen-label">MAIN SCREEN</div>
      <div class="ippon">IPPON!</div>
      <div class="meter"><i></i><i></i><i></i><i></i><i></i><i></i></div>
    </div>
    <div class="device host"><b>HOST</b><small>司会・SE</small></div>
    <div class="device cam"><b>CAM</b><small>スマホ配信</small></div>
    <div class="judges">
      <div class="phone on"></div><div class="phone on"></div><div class="phone"></div><div class="phone on"></div><div class="phone on"></div>
      <div class="phone"></div><div class="phone on"></div><div class="phone"></div><div class="phone on"></div><div class="phone"></div>
    </div>
    <div class="judges-label label">JUDGE × 10 ── 6 票で IPPON</div>
  </div>
</div>
</body>
</html>

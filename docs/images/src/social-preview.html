<!DOCTYPE html>
<!-- GitHub の Social preview（1280×640, 1MB 以下）。scripts/render-images.sh で docs/images/social-preview.png に書き出す。
     一覧やリンクカードで縮小表示されるので、要素は最小限にして周囲 40px 以上の余白を取る -->
<html lang="ja">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Zen+Kaku+Gothic+New:wght@700;900&display=block" rel="stylesheet">
<link rel="stylesheet" href="common.css">
<style>
body { width: 1280px; height: 640px; }
.stage {
  position: relative; width: 100%; height: 100%; overflow: hidden;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  background: radial-gradient(ellipse 55% 70% at 50% 42%, rgba(204,0,255,0.34), transparent 72%), var(--ink);
}
.burst { position: absolute; left: 50%; top: 42%; width: 1400px; height: 1400px; transform: translate(-50%, -50%);
  background: repeating-conic-gradient(rgba(204,0,255,0.13) 0 5deg, transparent 5deg 15deg);
  -webkit-mask: radial-gradient(circle, #000 0 18%, transparent 52%); mask: radial-gradient(circle, #000 0 18%, transparent 52%);
}
.kicker { position: relative; font-size: 28px; font-weight: 900; letter-spacing: 10px; color: var(--magenta-soft); }
.title { position: relative; font-family: 'Bebas Neue', sans-serif; font-size: 250px; line-height: 0.9; letter-spacing: 10px; color: #fff; margin-top: 10px;
  text-shadow: 0 0 30px rgba(204,0,255,0.55); }
.title span { color: var(--magenta); text-shadow: 0 0 40px rgba(204,0,255,0.9); }
.meter { position: relative; display: flex; gap: 12px; width: 720px; margin-top: 18px; }
.meter i { flex: 1; height: 20px; border-radius: 5px; background: var(--magenta); box-shadow: 0 0 18px rgba(204,0,255,0.9); }
.chips { position: relative; display: flex; gap: 12px; margin-top: 44px; }
.chips .chip { font-size: 26px; padding: 7px 22px 5px; }
</style>
</head>
<body>
<div class="stage">
  <div class="burst"></div>
  <div class="kicker">大喜利王決定戦 採点システム</div>
  <div class="title">IPPON <span>GP</span></div>
  <div class="meter"><i></i><i></i><i></i><i></i><i></i><i></i></div>
  <div class="chips"><span class="chip main">MAIN</span><span class="chip host">HOST</span><span class="chip judge">JUDGE</span><span class="chip cam">CAM</span></div>
</div>
</body>
</html>

<!DOCTYPE html>
<!-- GitHub の Social preview（1280×640, 1MB 以下）。scripts/render-images.sh で docs/images/social-preview.png に書き出す。
     リンクカードではリポジトリ名と説明文が横に出るので、画像はタイトルと投票メーターだけにしている -->
<html lang="ja">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=block" rel="stylesheet">
<link rel="stylesheet" href="common.css">
<style>
body { width: 1280px; height: 640px; }
.stage {
  width: 100%; height: 100%;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 44px;
  background: radial-gradient(ellipse 50% 60% at 50% 45%, rgba(204,0,255,0.22), transparent 75%), var(--ink);
}
.title { font-family: 'Bebas Neue', sans-serif; font-size: 168px; line-height: 0.9; letter-spacing: 8px; color: #fff; text-align: center; }
.title span { color: var(--magenta); }
.meter { display: flex; gap: 14px; width: 640px; }
.meter i { flex: 1; height: 16px; border-radius: 4px; background: var(--magenta); box-shadow: 0 0 16px rgba(204,0,255,0.7); }
</style>
</head>
<body>
<div class="stage">
  <div class="title">SONG <span>OGIRI</span><br>GRAND PRIX</div>
  <div class="meter"><i></i><i></i><i></i><i></i><i></i><i></i></div>
</div>
</body>
</html>

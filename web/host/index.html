}
.hold-reset::before {

}

/* ボリューム */
</style>

<script type="module">
import { initializeApp, getDatabase, ref, set, remove, update, onValue, get } from '../src/shared/firebase.js';
import { THRESHOLD_PATH, DEFAULT_THRESHOLD, thresholdFromValue, voteStep } from '../src/shared/ippon.js';
import { PLAYERS_PATH, PLAYER_COUNT, PLAYER_COUNT_PATH, DEFAULT_PLAYER_COUNT, playerAt, scoreIndex, playersFromValue, playerCountFromValue, isPosVisible, escapeHtml } from '../src/shared/players.js';
import { CLIENTS_MAIN_PATH, mainStatusPhase } from '../src/shared/mainStatus.js';
import { ODAI_COUNT_PATH, DEFAULT_ODAI_COUNT, MAX_ODAI_COUNT, odaiCountFromValue } from '../src/shared/odai.js';
import { formatQualityRecord, isQualityStale } from '../src/shared/webrtc-stats.js';
import { modeUpdates } from '../src/shared/mode.js';
import { agendaClearAction } from '../src/shared/agenda.js';

const STORAGE_BASE = window.IPPON_CONFIG.storageBase;

const firebaseConfig = window.IPPON_CONFIG.firebase;

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

let masterVolume = 1.0;
let currentScores = [0,0,0,0,0];

// Web Audio API unlock + new Audio()方式
const BASE = STORAGE_BASE + 'mp3%2F';
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
let audioUnlocked = false;

window.unlockAudio = async () => {
  if (audioUnlocked) return;
  await audioCtx.resume();
  const buf = audioCtx.createBuffer(1, 1, 22050);
  const src = audioCtx.createBufferSource();
  src.buffer = buf;
  src.connect(audioCtx.destination);
  src.start(0);
  const unlockList = [...Object.values(sounds), sound10, soundIppon, ...Object.values(odaiAudios), ...Object.values(laughAudios), noIpponAudio, shutsudaiAudio, thinkingAudio, ...Object.values(agendaAudios)];
  for (const a of unlockList) {
    a.volume = 0;
    try { await a.play(); a.pause(); a.currentTime = 0; a.volume = masterVolume; } catch(e) {}
  }
  audioUnlocked = true;
};

// 最初のクリックで自動unlock
document.addEventListener('click', () => window.unlockAudio(), { once: true });
document.addEventListener('touchstart', () => window.unlockAudio(), { once: true });

setInterval(() => audioCtx.resume(), 30000);

// 音声URL（BASE は上部で定義済み）
const sounds = {
  "1": new Audio(BASE + '1.mp3?alt=media'),
  "2": new Audio(BASE + '2.mp3?alt=media'),
  "3": new Audio(BASE + '3.mp3?alt=media'),
  "4": new Audio(BASE + '4.mp3?alt=media'),
  "5": new Audio(BASE + '5.mp3?alt=media'),
};
// ===== 投票音をAudioBufferで事前デコード（ほぼ遅延ゼロ再生） =====
const voteSoundUrls = {
  "1": BASE + '1.mp3?alt=media',
  "2": BASE + '2.mp3?alt=media',
  "3": BASE + '3.mp3?alt=media',
  "4": BASE + '4.mp3?alt=media',
  "5": BASE + '5.mp3?alt=media',
  "6": BASE + '6.mp3?alt=media',
};
const voteBuffers = {};

async function loadVoteBuffer(key, url) {
  try {
    const res = await fetch(url);
    const arr = await res.arrayBuffer();
    voteBuffers[key] = await audioCtx.decodeAudioData(arr);
  } catch(e) { console.warn('Buffer load failed:', key, e); }
}
// 全投票音をバックグラウンドでデコード
Object.entries(voteSoundUrls).forEach(([k, url]) => loadVoteBuffer(k, url));

function playVoteBuffer(key) {
  const buf = voteBuffers[key];
  if (!buf || !audioCtx) return false;
  try {
    const src = audioCtx.createBufferSource();
    src.buffer = buf;
    const gain = audioCtx.createGain();
    gain.gain.value = masterVolume;
    src.connect(gain);
    gain.connect(audioCtx.destination);
    src.start(0);
    return src; // onendedをセットできるように返す
  } catch(e) { return false; }
}
const sound10 = new Audio(BASE + '6.mp3?alt=media');
const soundIppon = new Audio(BASE + 'IPPON.mp3?alt=media');
const shutsudaiAudio = new Audio(BASE + encodeURIComponent('出題音.mp3') + '?alt=media');
const thinkingAudio = new Audio(BASE + encodeURIComponent('ルイジアナ.mp3') + '?alt=media');
thinkingAudio.loop = true;
const odaiAudios = {
  1: new Audio(STORAGE_BASE + 'mp3_question%2Fmp3_question1.mp3?alt=media'),
  2: new Audio(STORAGE_BASE + 'mp3_question%2Fmp3_question2.mp3?alt=media'),
  3: new Audio(STORAGE_BASE + 'mp3_question%2Fmp3_question3.mp3?alt=media'),
  4: new Audio(STORAGE_BASE + 'mp3_question%2Fmp3_question4.mp3?alt=media'),
  5: new Audio(STORAGE_BASE + 'mp3_question%2Fmp3_question5.mp3?alt=media'),
  6: new Audio(STORAGE_BASE + 'mp3_question%2Fmp3_question6.mp3?alt=media'),
};
const noIpponAudio = new Audio(STORAGE_BASE + 'mp3%2Fno-ippon.mp3?alt=media');
const laughAudios = {
  1: new Audio(BASE + 'laugh1.mp3?alt=media'),
  2: new Audio(BASE + 'laugh2.mp3?alt=media'),
  3: new Audio(BASE + 'laugh3.mp3?alt=media'),
  4: new Audio(BASE + 'laugh4.mp3?alt=media'),
};
const agendaAudios = {
  se_cheer:  new Audio(STORAGE_BASE + 'mp3%2Fmp3_%E6%AD%93%E5%A3%B0.mp3?alt=media'),
  se_clap:   new Audio(STORAGE_BASE + 'mp3%2Fmp3_%E6%8B%8D%E6%89%8B.mp3?alt=media'),
  se_buzzer: new Audio(STORAGE_BASE + 'mp3%2Fsyuryo.mp3?alt=media'),
};

// 全音声リスト
const allAudios = [...Object.values(sounds), sound10, soundIppon, shutsudaiAudio, thinkingAudio, noIpponAudio,
  ...Object.values(odaiAudios), ...Object.values(laughAudios), ...Object.values(agendaAudios)];

// 読み込み中オーバーレイ
const overlay = document.createElement('div');
overlay.id = 'loading-overlay';
overlay.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.85);z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;';
overlay.innerHTML = '<div style="color:#f5c400;font-size:22px;font-weight:900;">読み込み中...</div><div id="load-progress" style="color:#aaa;font-size:14px;">0 / ' + allAudios.length + '</div>';
document.body.appendChild(overlay);

// 全音声ロード＆進捗表示
let loadedCount = 0;
const progressEl = document.getElementById('load-progress');
allAudios.forEach(a => {
  a.addEventListener('canplaythrough', () => {
    loadedCount++;
    progressEl.textContent = loadedCount + ' / ' + allAudios.length;
    if (loadedCount >= allAudios.length) {
      overlay.style.transition = 'opacity 0.5s';
      overlay.style.opacity = '0';
      setTimeout(() => overlay.remove(), 500);
    }
  }, { once: true });
  a.load();
});

// 10秒後に強制的にオーバーレイを消す
setTimeout(() => {
  if (overlay.parentNode) {
    overlay.style.transition = 'opacity 0.5s';
    overlay.style.opacity = '0';
    setTimeout(() => { if (overlay.parentNode) overlay.remove(); }, 500);

let soundQueue = [];
let isPlaying = false;
let prevVoteCount = 0;

function enqueueVoteSound(count) {
  soundQueue.push(count);
  if (!isPlaying) playNextInQueue();
}
function playNextInQueue() {
  if (soundQueue.length === 0) { isPlaying = false; return; }
  isPlaying = true;
  const c = soundQueue.shift();
  if (c >= threshold) {
    // IPPON の票: 6.mp3 → IPPON.mp3。バッファ優先、なければnew Audio
    const src = playVoteBuffer("6");
    if (src) {
      src.onended = () => {
        soundIppon.volume = masterVolume;
        soundIppon.currentTime = 0;
        soundIppon.play().catch(()=>{});
        soundIppon.onended = () => setTimeout(playNextInQueue, 150);
      };
    } else {
      sound10.volume = masterVolume;
      sound10.currentTime = 0;
      sound10.play().catch(()=>{});
      sound10.onended = () => {
        soundIppon.volume = masterVolume;
        soundIppon.currentTime = 0;
        soundIppon.play().catch(()=>{});
        soundIppon.onended = () => setTimeout(playNextInQueue, 150);
      };
    }
    return;
  }
  // IPPON 前の票: 1〜5.mp3。バッファ優先、なければnew Audio
  const key = String(voteStep(c, threshold));
  const played = playVoteBuffer(key);
  if (!played) {
    const audio = sounds[key];
    if (audio) {
      audio.volume = masterVolume;
      audio.currentTime = 0;
      audio.play().catch(()=>{});
    }
  }
  setTimeout(playNextInQueue, 50);
}

let mainStatusDetailOpen = false;

window.toggleMainStatusDetail = () => {
  mainStatusDetailOpen = !mainStatusDetailOpen;
  renderMainStatus();
};
function renderMainStatus() {
  const v = lastMainStatus;
  const label = document.getElementById('main-status-label');
  const bar = document.getElementById('main-status-bar');
  const detail = document.getElementById('main-status-detail');
  const phase = mainStatusPhase(v);
  if (phase === 'unknown') {
    label.textContent = '未確認（MAIN 未接続 or 読み込み前）';
    label.style.color = '#888';
    bar.style.borderColor = '#333';
    detail.style.display = 'none';
    return;
  }
  const failedCount = typeof v.failedCount === 'number' ? v.failedCount : (Array.isArray(v.failed) ? v.failed.length : 0);
  if (phase === 'error') {
    label.textContent = `${v.loaded} / ${v.total} ⚠ ${failedCount} 件失敗`;
    label.style.color = '#ff8888';
    bar.style.borderColor = '#aa4444';
  } else if (phase === 'done') {
    label.textContent = `${v.loaded} / ${v.total} ✓`;
    label.style.color = '#88ff88';
    bar.style.borderColor = '#333';
  } else {
    label.textContent = `${v.loaded} / ${v.total} 読み込み中…`;
    label.style.color = '#f5c400';
    bar.style.borderColor = '#333';
  }
  if (mainStatusDetailOpen && Array.isArray(v.failed) && v.failed.length) {
    detail.innerHTML = v.failed.map((f) => `<div>${escapeHtml(f)}</div>`).join('') +
      (failedCount > v.failed.length ? `<div style="color:#999;">…他 ${failedCount - v.failed.length} 件</div>` : '');
    detail.style.display = 'block';
  } else {
    detail.style.display = 'none';
  }
}

let pendingAgendaClear = null;
function markAgendaClear(replacing) {
  pendingAgendaClear = { replacing };
}

// 削除イベントを判定できないため追跡する。これが無いと、ページ読み込み直後

    const action = agendaClearAction({
      hostInitiated: !!pendingAgendaClear,

    currentAgendaKey = null;
    if (btn) btn.textContent = '▶ ' + (key === 'op_comment' ? 'OP COMMENT' : 'OP MOVIE');

    resetAgendaBtnText();
    currentAgendaKey = key;
    markAgendaClear(true);
    remove(ref(db, 'agenda')).then(() => {
      set(ref(db, 'mode'), 'agenda');

<script>
// module読み込み前のプロキシ関数（onclickから呼ばれる）
// moduleが読み込まれると_realXxxに本物の関数がセットされる
var _realAddScore, _realResetScores, _realTriggerSE, _realBecomeMaster;

window.addScore = function(pi, delta) { if (_realAddScore) _realAddScore(pi, delta); };
window.resetScores = function() { if (_realResetScores) _realResetScores(); };
window.triggerSE = function(key) { if (_realTriggerSE) _realTriggerSE(key); };
window.becomeMaster = function() { if (_realBecomeMaster) _realBecomeMaster(); };

// 長押し確定ヘルパー：ms 押し続けたら onFire、途中で離すとキャンセル
// 誤タップで全スコアが消えないよう、スコアリセットは単タップでは発火しない
function bindLongPress(el, onFire, ms) {
  ms = ms || 600;
  const label = el.textContent;
  const HINT = '長押しでリセット';
  let timer = null, hintTimer = null, activeId = null;
  el.style.setProperty('--hold-ms', ms + 'ms');
  const restore = () => { el.classList.remove('holding', 'fired'); el.textContent = label; };
  const cancel = (e) => {
    if (activeId === null || (e && e.pointerId !== undefined && e.pointerId !== activeId)) return;
    activeId = null;
    clearTimeout(timer); timer = null;
    el.classList.remove('holding');
    // 早く離した＝タップ扱い：ヒントだけ残して戻す
    clearTimeout(hintTimer);
    hintTimer = setTimeout(restore, 900);
  };
  el.addEventListener('pointerdown', (e) => {
    if (activeId !== null || (e.button !== undefined && e.button !== 0)) return;
    e.preventDefault();
    activeId = e.pointerId;
    clearTimeout(hintTimer);
    el.classList.remove('fired');
    el.classList.add('holding');
    el.textContent = HINT;
    timer = setTimeout(() => {
      timer = null; activeId = null;
      el.classList.remove('holding');
      el.classList.add('fired');
      el.textContent = 'リセットしました';
      hintTimer = setTimeout(restore, 1200);
      onFire();
    }, ms);
  });
  ['pointerup', 'pointercancel', 'pointerleave'].forEach((t) => el.addEventListener(t, cancel));
  el.addEventListener('contextmenu', (e) => e.preventDefault());
  el.addEventListener('click', (e) => e.preventDefault()); // タップ/Enter では発火しない
}
window.bindLongPress = bindLongPress;
['reset-scores-btn', 'sub-reset-btn'].forEach((id) => {
  const el = document.getElementById(id);
  if (el) bindLongPress(el, () => window.resetScores(), 600);
});
window.goFullscreen = () => {
  document.documentElement.requestFullscreen();
  document.getElementById('fullscreen-btn-host').style.display = 'none';
};

  if (!document.fullscreenElement) {

});

</script>

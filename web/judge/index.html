<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<script src="../config/config.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>審査員 | SONG OGIRI GRAND PRIX</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; touch-action: manipulation; }
html, body { overflow: hidden; height: 100%; }
body { background: #000; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; -webkit-text-size-adjust: 100%; overflow: hidden; }
.logo { font-size: 11px; color: #d4a017; font-weight: 900; letter-spacing: 3px; text-align: center; margin-bottom: 16px; }

#view-select { width: 100%; max-width: 320px; display: flex; flex-direction: column; align-items: center; }
.select-title { font-size: 14px; color: #aaa; font-weight: 700; letter-spacing: 2px; text-align: center; margin-bottom: 14px; }
.select-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; width: 100%; }
.select-btn { background: #1a1a1a; border: 2px solid #d4a017; border-radius: 10px; color: #d4a017; font-size: 15px; font-weight: 900; padding: 22px 0; cursor: pointer; text-align: center; transition: background 0.1s; }
.select-btn.small { font-size: 12px; }
.select-btn:active { background: #2a2000; }
.select-btn.taken { border-color: #444; color: #666; background: #111; }
.select-btn.taken small { display: block; font-size: 10px; font-weight: 700; margin-top: 4px; letter-spacing: 1px; }
.select-btn.pressing { background: #2a2000; border-color: #f5c400; }
.seat-msg { font-size: 12px; color: #d4a017; font-weight: 700; text-align: center; min-height: 1.5em; margin-bottom: 10px; }

#view-vote { width: 100%; max-width: 320px; display: none; flex-direction: column; align-items: center; gap: 16px; }
.vote-btn { width: 100%; border: none; border-radius: 12px; font-size: 26px; font-weight: 900; padding: 70px 0; cursor: pointer; text-align: center; transition: opacity 0.1s; }
.vote-btn.active { background: #d4a017; color: #111; }
.vote-btn.active:active { opacity: 0.85; }
.vote-btn.voted { background: #333; color: #555; cursor: default; }
.vote-btn.locked { background: #222; color: #444; cursor: default; }
.vote-sub { font-size: 13px; display: block; margin-top: 8px; }
.back-link { font-size: 12px; color: #555; text-decoration: underline; cursor: pointer; background: none; border: none; }

#all-btn { position: fixed; bottom: 14px; left: 14px; background: none; border: 1px solid #333; border-radius: 4px; color: #444; font-size: 10px; padding: 4px 8px; cursor: pointer; }

#view-all { width: 100%; max-width: 320px; display: none; flex-direction: column; align-items: center; gap: 12px; }
.grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; width: 100%; }
.seat-btn { background: #d4a017; border: none; border-radius: 8px; color: #111; font-size: 16px; font-weight: 900; padding: 22px 0; cursor: pointer; text-align: center; transition: transform 0.1s; }
.seat-btn:active { transform: scale(0.95); }
.seat-btn.voted { background: #333; color: #555; cursor: default; }
.seat-btn.locked { background: #222; color: #444; cursor: default; }
</style>
</head>
<body>

<div id="view-select">
  <div class="logo">SONG OGIRI GRAND PRIX</div>
  <div class="select-title">審査員選択</div>
  <div class="seat-msg" id="seat-msg" role="status" aria-live="polite"></div>
  <div class="select-grid" id="select-grid"></div>
</div>

<div id="view-vote">
  <div class="logo">SONG OGIRI GRAND PRIX</div>
  <button class="vote-btn active" id="vote-btn" onclick="doVote()"><span id="vote-name"></span><span class="vote-sub" id="vote-sub"></span></button>
  <button class="back-link" onclick="goBack()">戻る</button>
</div>

<div id="view-all">
  <div class="logo">SONG OGIRI GRAND PRIX</div>
  <div class="grid" id="grid"></div>
  <button class="back-link" onclick="goBackFromAll()">戻る</button>
</div>

<button id="all-btn" onclick="showAll()">全員</button>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-app.js";
import { getDatabase, ref, set, onValue, remove, runTransaction, onDisconnect, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-database.js";
import { JUDGES_PATH, judgesFromValue } from "../src/shared/judges.js";
import { THRESHOLD_PATH, DEFAULT_THRESHOLD, thresholdFromValue } from "../src/shared/ippon.js";
import { SEATS_PATH, SEAT_KEY, loadDeviceId, seatState, claimUpdate, releaseUpdate } from "../src/shared/seats.js";

const STORAGE_BASE = window.IPPON_CONFIG.storageBase;

const firebaseConfig = window.IPPON_CONFIG.firebase;

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const votesRef = ref(db, 'votes');

// 席は設定画面（admin/）で編集する settings/judges から作る。設定が無ければ初期値の 10 席
let judges = [];
let seatNames = {};
// IPPON に必要な票数（設定画面で変更。無ければ 6）
let threshold = DEFAULT_THRESHOLD;

let currentVotes = {};
let isRevealed = false;
let isSaitenMode = false;
let selectedSeat = null;
let previousView = 'select';

// 座席ロック（#25）: seats/{seat} = { device, at }。1 席 1 台。端末が消えると onDisconnect で外れる
const storage = (() => { try { return window.localStorage; } catch { return null; } })();
const DEVICE = loadDeviceId(storage);
let claims = {};
let judgesLoaded = false;
let claimsLoaded = false;
let restored = false;
let reclaiming = false;
const LONG_PRESS_MS = 1200;

function saveSeat(seat) {
  try { seat ? storage?.setItem(SEAT_KEY, String(seat)) : storage?.removeItem(SEAT_KEY); } catch {}
}
function loadSeat() {
  try { return Number(storage?.getItem(SEAT_KEY)) || null; } catch { return null; }
}
function setSeatMsg(text) {
  document.getElementById('seat-msg').textContent = text;
}

// 席を取る。force = 使用中の席を引き継ぐ（前の端末の席を外してから取る）
async function claimSeat(seat, { force = false } = {}) {
  const seatRef = ref(db, `${SEATS_PATH}/${seat}`);
  try {
    if (force) await remove(seatRef);
    const res = await runTransaction(seatRef, (cur) => claimUpdate(cur, DEVICE, serverTimestamp()));
    if (!res.committed) {
      setSeatMsg(`${seatNames[seat] || seat} は別の端末で使われています。長押しで引き継げます`);
      return false;
    }
    await onDisconnect(seatRef).remove();
    return true;
  } catch (e) {
    setSeatMsg('席を取れませんでした。通信状態を確認して、もう一度選んでください');
    return false;
  }
}

// 自分の席を外す（他の端末に引き継がれていたら何もしない）
async function releaseSeat(seat) {
  const seatRef = ref(db, `${SEATS_PATH}/${seat}`);
  try {
    await onDisconnect(seatRef).cancel();
    await runTransaction(seatRef, (cur) => releaseUpdate(cur, DEVICE));
  } catch {}
}

// 使用中の席を長押しで引き継ぐためのボタン
function holdToTake(btn, onHold) {
  let timer = null;
  const cancel = () => { clearTimeout(timer); timer = null; btn.classList.remove('pressing'); };
  btn.addEventListener('pointerdown', () => {
    btn.classList.add('pressing');
    timer = setTimeout(() => { cancel(); onHold(); }, LONG_PRESS_MS);
  });
  for (const ev of ['pointerup', 'pointerleave', 'pointercancel']) btn.addEventListener(ev, cancel);
  btn.addEventListener('contextmenu', (e) => e.preventDefault());
}

// 前回の席に戻る（再読み込み時）。席の設定と座席ロックの両方が読めてから 1 回だけ
function maybeRestore() {
  if (restored || !judgesLoaded || !claimsLoaded) return;
  restored = true;
  const saved = loadSeat();
  if (!saved) return;
  if (!seatNames[saved]) { saveSeat(null); return; }
  if (seatState(claims, saved, DEVICE) === 'taken') {
    saveSeat(null);
    setSeatMsg(`前回の席（${seatNames[saved]}）は別の端末で使われています`);
    return;
  }
  selectSeat(saved);
}

const selectGrid = document.getElementById('select-grid');
function renderSelect() {
  selectGrid.innerHTML = '';
  for (const j of judges) {
    const btn = document.createElement('button');
    const taken = seatState(claims, j.seat, DEVICE) === 'taken';
    btn.className = 'select-btn' + (j.kind === 'venue' ? ' small' : '') + (taken ? ' taken' : '');
    btn.textContent = j.name;
    if (taken) {
      const note = document.createElement('small');
      note.textContent = '使用中・長押しで引き継ぐ';
      btn.appendChild(note);
      btn.onclick = () => setSeatMsg(`${j.name} は別の端末で使われています。長押しで引き継げます`);
      holdToTake(btn, () => selectSeat(j.seat, { force: true }));
    } else {
      btn.onclick = () => selectSeat(j.seat);
    }
    selectGrid.appendChild(btn);
  }
}

async function selectSeat(seat, opts) {
  const prev = selectedSeat;
  selectedSeat = null; // 取り直しの間に「席が外れた → 取り直す」が走らないように
  if (prev && prev !== seat) await releaseSeat(prev);
  if (!(await claimSeat(seat, opts))) { saveSeat(null); showView('select'); return; }
  selectedSeat = seat;
  saveSeat(seat);
  setSeatMsg('');
  document.getElementById('vote-name').textContent = seatNames[seat];
  showView('vote');
  updateVoteBtn();
}

function showView(view) {
  document.getElementById('view-select').style.display = 'none';
  document.getElementById('view-vote').style.display = 'none';
  document.getElementById('view-all').style.display = 'none';
  if (view === 'select') document.getElementById('view-select').style.display = 'flex';
  else if (view === 'vote') document.getElementById('view-vote').style.display = 'flex';
  else if (view === 'all') document.getElementById('view-all').style.display = 'flex';
}

window.goBack = () => {
  const seat = selectedSeat;
  selectedSeat = null;
  saveSeat(null);
  if (seat) releaseSeat(seat);
  showView('select');
};
window.showAll = () => { previousView = selectedSeat ? 'vote' : 'select'; showView('all'); renderAll(currentVotes); };
window.goBackFromAll = () => showView(previousView);

window.doVote = () => {
  if (!selectedSeat) return;
  const totalVotes = Object.keys(currentVotes).length;
  if (!isSaitenMode || isRevealed || currentVotes[selectedSeat] || totalVotes >= threshold) return;
  set(ref(db, `votes/${selectedSeat}`), true);
};

function updateVoteBtn() {
  if (!selectedSeat) return;
  const btn = document.getElementById('vote-btn');
  const sub = document.getElementById('vote-sub');
  const isIppon = Object.keys(currentVotes).length >= threshold;
  const isVoted = currentVotes[selectedSeat];
  if (isRevealed || isIppon) {
    btn.className = 'vote-btn locked';
    sub.textContent = '採点終了';
  } else if (!isSaitenMode) {
    btn.className = 'vote-btn locked';
    sub.textContent = '採点中ではありません';
  } else if (isVoted) {
    btn.className = 'vote-btn voted';
    sub.textContent = '✓ 投票済み';
  } else {
    btn.className = 'vote-btn active';
    sub.textContent = '';
  }
}

function renderAll(votes) {
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  const isIppon = Object.keys(votes).length >= threshold;
  for (const { seat: i } of judges) {
    const btn = document.createElement('button');
    const isVoted = votes[i] === true;
    const label = seatNames[i];
    if (isRevealed || isIppon) {
      btn.className = 'seat-btn locked';
      btn.textContent = isVoted ? label + ' ✓' : label;
    } else if (!isSaitenMode) {
      btn.className = 'seat-btn locked';
      btn.textContent = label;
    } else {
      btn.className = 'seat-btn' + (isVoted ? ' voted' : '');
      btn.textContent = isVoted ? label + ' ✓' : label;
    }
    btn.onclick = () => {
      const total = Object.keys(currentVotes).length;
      if (!isSaitenMode || isRevealed || currentVotes[i] || total >= threshold) return;
      set(ref(db, `votes/${i}`), true);
    };
    grid.appendChild(btn);
  }
}

onValue(ref(db, JUDGES_PATH), (snapshot) => {
  judges = judgesFromValue(snapshot.val()).judges;
  seatNames = Object.fromEntries(judges.map(j => [j.seat, j.name]));
  renderSelect();
  judgesLoaded = true;
  if (selectedSeat && !seatNames[selectedSeat]) {
    // 自分の席が設定から消えたら、席を外して席選択に戻す
    const seat = selectedSeat;
    selectedSeat = null;
    saveSeat(null);
    releaseSeat(seat);
    setSeatMsg('席の設定が変わりました。席を選び直してください');
    showView('select');
  } else if (selectedSeat) {
    document.getElementById('vote-name').textContent = seatNames[selectedSeat];
  }
  updateVoteBtn();
  renderAll(currentVotes);
  maybeRestore();
});
onValue(ref(db, SEATS_PATH), (snapshot) => {
  claims = snapshot.val() || {};
  claimsLoaded = true;
  if (selectedSeat) {
    const state = seatState(claims, selectedSeat, DEVICE);
    if (state === 'taken') {
      // 別の端末が長押しで引き継いだ
      const seat = selectedSeat;
      selectedSeat = null;
      saveSeat(null);
      onDisconnect(ref(db, `${SEATS_PATH}/${seat}`)).cancel().catch(() => {});
      setSeatMsg(`${seatNames[seat] || seat} は別の端末に引き継がれました`);
      showView('select');
    } else if (state === 'free' && !reclaiming) {
      // 通信断で onDisconnect が走った・誰かに外された等で席が空いた → 取り直す
      reclaiming = true;
      claimSeat(selectedSeat).finally(() => { reclaiming = false; });
    }
  }
  renderSelect();
  maybeRestore();
});
// 再接続したら onDisconnect を登録し直す（切断時に 1 回実行されると消えるため）
onValue(ref(db, '.info/connected'), (snapshot) => {
  if (snapshot.val() === true && selectedSeat && !reclaiming) claimSeat(selectedSeat);
});
onValue(ref(db, THRESHOLD_PATH), (snapshot) => {
  threshold = thresholdFromValue(snapshot.val());
  updateVoteBtn();
  renderAll(currentVotes);
});
onValue(ref(db, 'mode'), (snapshot) => {
  isSaitenMode = snapshot.val() === 'saiten';
  updateVoteBtn();
  renderAll(currentVotes);
});
onValue(ref(db, 'revealed'), (snapshot) => {
  isRevealed = snapshot.val() || false;
  updateVoteBtn();
  renderAll(currentVotes);
});
onValue(votesRef, (snapshot) => {
  currentVotes = snapshot.val() || {};
  updateVoteBtn();
  renderAll(currentVotes);
});
// スリープ防止（Wake Lock API + iOS向け無音動画）
let wakeLock = null;
async function requestWakeLock() {
  try {
    wakeLock = await navigator.wakeLock.request('screen');
  } catch(e) {}
}
document.addEventListener('visibilitychange', async () => {
  if (document.visibilityState === 'visible') {
    await requestWakeLock();
  }
});
requestWakeLock();

// iOS Safari向け: 無音動画ループでスリープ防止
(function() {
  const v = document.createElement('video');
  v.setAttribute('playsinline', '');
  v.setAttribute('muted', '');
  v.setAttribute('loop', '');
  v.style.cssText = 'position:fixed;top:-1px;left:-1px;width:1px;height:1px;opacity:0;pointer-events:none;';
  v.src = 'data:video/mp4;base64,AAAAIGZ0eXBpc29tAAACAGlzb21pc28ybXA0MQAAAAhmcmVlAAAAG21kYXQAAAGzABAHAAABthADAowdbb9/AAAC6W1vb3YAAABsbXZoZAAAAAB8JbCAfCWwgAAAA+gAAAAAAAAAAAAAAAABAAAAAAAAAAAAAAAAAAAAAAABAAAAAAAAAAAAAAAAAAEAAAAAAAAAAAAAAAAAAAABAAAAAAAAAAAAAAAAAAHAAAA4bXNlaAAAAABAAAAhmZGlhAAAAHG1kaGQAAAAAAAAAAAAAAAAAKAAAAAAAAAAAAAAAAAAAACFoZGxyAAAAAAAAAAB2aWRlAAAAAAAAAAAAAAAAVmlkZW9IYW5kbGVyAAAAAS1taW5mAAAAFHZtaGQAAAABAAAAAAAAAAAAAAAkZGluZgAAABxkcmVmAAAAAAAAAAEAAAAMdXJsIAAAAAEAAADtc3RibAAAAIlzdHNkAAAAAAAAAAEAAAB5YXZjMQAAAAAAAAABAAAAAAAAAAAAAAAAAAAAAAEAAQBIAAAASAAAAAAAAAABAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAGP//AAAAQ2F2Y0MBQsAK/+EAGWdCwArZBaHegIQAAAMAAQAAAwAKjxYtlgEABmjr48siwAAAABhzdHRzAAAAAAAAAAEAAAABAAAAAQAAABRzdHNzAAAAAAAAAAEAAAABAAAAHHN0c2MAAAAAAAAAAQAAAAEAAAABAAAAAQAAABRzdHN6AAAAAAAAAAsAAAABAAAAFHN0Y28AAAAAAAAAAQAAAAwAAAAYc3RzcwAAAAAAAAABAAAAAAA=';
  document.body.appendChild(v);
  document.addEventListener('touchstart', () => { v.play(); }, { once: true });
})();
</script>
</html>

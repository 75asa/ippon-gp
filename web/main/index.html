<style>
/* 素材の読み込み状況（#26）。全画面中は出さない */
#asset-status { position: fixed; left: 16px; bottom: 16px; z-index: 10000; max-width: min(46vw, 560px); background: rgba(12, 0, 22, 0.88); border: 1px solid rgba(204, 0, 255, 0.55); border-radius: 12px; color: #fff; font-family: 'Hiragino Sans', 'Yu Gothic', sans-serif; font-size: 13px; line-height: 1.5; padding: 10px 14px; box-shadow: 0 6px 24px rgba(0, 0, 0, 0.5); }

#asset-status .as-bar { height: 4px; border-radius: 2px; background: rgba(255, 255, 255, 0.15); margin-top: 6px; overflow: hidden; }

#asset-status button { border: 1px solid rgba(255, 255, 255, 0.35); background: rgba(255, 255, 255, 0.1); color: #fff; border-radius: 8px; padding: 4px 12px; font-size: 12px; font-weight: 700; cursor: pointer; }
#asset-status button.as-retry { background: #cc00ff; border-color: #cc00ff; }
</style>
<script>
// 素材の読み込み状況（#26）。既存のプリロードとは別に、MAIN が使う画像の URL を 1 つずつ読み、成功・失敗を数えて左下に出す。
// Storage の Cache-Control が効くので二重ダウンロードにはならない。失敗した素材は一覧にして、再試行できるようにする。
(function() {
  var state = {};   // url -> 'loading' | 'ok' | 'error'
  var order = [];
  var dismissed = false;
  var hideTimer = null;
  var el = null;

  function label(url) {
    var m = url.match(/\/o\/([^?]+)/);
    try { return m ? decodeURIComponent(m[1]) : url; } catch (e) { return url; }
  }
  function load(url, retry) {
    state[url] = 'loading';
    var img = new Image();
    img.onload = function() {
      state[url] = 'ok';
      if (retry) refreshDom(url, img.src);
      render();
    };
    img.onerror = function() { state[url] = 'error'; render(); };
    img.src = retry ? url + '&retry=' + Date.now() : url;
  }
  // 再試行で読めた素材は、同じ URL を持つ表示用の img も読み直す（id / data-src で参照しているので src を変えても動く）
  function refreshDom(url, fresh) {
    document.querySelectorAll('img').forEach(function(i) { if (i.getAttribute('src') === url) i.src = fresh; });
  }
  function counts() {
    var c = { ok: 0, error: 0, loading: 0 };
    order.forEach(function(u) { c[state[u]]++; });
    return c;
  }
  function ensureEl() {
    if (el || !document.body) return el;
    el = document.createElement('div');
    el.id = 'asset-status';
    el.setAttribute('role', 'status');
    el.setAttribute('aria-live', 'polite');
    document.body.appendChild(el);
    return el;
  }
  function render() {
    if (!ensureEl()) return;
    var c = counts();
    var total = order.length;
    var done = c.ok + c.error;
    var finished = c.loading === 0 && total > 0;
    el.className = c.error ? 'error' : '';
    el.replaceChildren();

    var head = document.createElement('div');
    head.className = 'as-head';
    var count = document.createElement('span');
    count.className = 'as-count';
    count.textContent = c.ok + ' / ' + total;
    var text = document.createElement('span');
    text.textContent = !finished ? '素材を読み込み中…' : c.error ? c.error + ' 件の素材を読み込めませんでした' : '素材の読み込み完了';
    head.append(count, text);
    var bar = document.createElement('div');
    bar.className = 'as-bar';
    var fill = document.createElement('i');
    fill.style.width = (total ? done / total * 100 : 0) + '%';
    bar.appendChild(fill);
    el.append(head, bar);

    if (finished && c.error) {
      var ul = document.createElement('ul');
      order.forEach(function(u) {
        if (state[u] !== 'error') return;
        var li = document.createElement('li');
        li.textContent = label(u);
        ul.appendChild(li);
      });
      var actions = document.createElement('div');
      actions.className = 'as-actions';
      var retry = document.createElement('button');
      retry.className = 'as-retry';
      retry.textContent = '再試行';
      retry.onclick = function() { dismissed = false; order.forEach(function(u) { if (state[u] === 'error') load(u, true); }); render(); };
      var close = document.createElement('button');
      close.textContent = '閉じる';
      close.onclick = function() { dismissed = true; render(); };
      actions.append(retry, close);
      el.append(ul, actions);
    }

    // 全部読めたら数秒で消す。失敗があれば「閉じる」まで出し続ける。全画面（本番の投影）中は出さない
    clearTimeout(hideTimer);
    var hide = !!document.fullscreenElement || dismissed;
    if (finished && !c.error && !hide) hideTimer = setTimeout(function() { el.hidden = true; }, 4000);
    el.hidden = hide;
  }

  window.IpponAssets = {
    // 同じ URL は 1 回だけ数える
    register: function(urls) {
      urls.forEach(function(u) {
        if (!u || state[u]) return;
        order.push(u);
        load(u, false);
      });
      render();
    },
  };
  document.addEventListener('DOMContentLoaded', render);
  document.addEventListener('fullscreenchange', render);
})();
</script>

  <div class="hint">ローカルデバイスは Wi‑Fi を通さないので画質が落ちません。スマホ → HDMI アダプタ → USB キャプチャ → この PC、または Mac の連係カメラ。選択は保存され、次回起動時に自動で使われます。</div>
  <div class="status" id="camera-settings-status"></div>
  <!-- 配信品質（#63）。操作員用。全画面にすると camera-settings ごと閉じるので客席には映らない -->
  <div class="status" id="camera-quality-status" style="color:#8cf;"></div>
</div>

<script type="module">
import { initializeApp, getDatabase, ref, onValue, onDisconnect, remove, set, get } from "../src/shared/firebase.js";
import { CODEC_DEFAULTS, preferCodec, setBitrateHints } from "../src/shared/sdp.js";
import { watchQuality, watchConnectionState, formatQuality, toQualityRecord, qualityRecordEquals } from "../src/shared/webrtc-stats.js";
import { THRESHOLD_PATH, DEFAULT_THRESHOLD, thresholdFromValue, voteStep } from "../src/shared/ippon.js";
import { PLAYERS_PATH, PLAYER_COUNT, playerAt, scoreIndex, playersFromValue, escapeHtml } from "../src/shared/players.js";

const STORAGE_BASE = window.IPPON_CONFIG.storageBase;

// ===== PeerJS カメラ受信 =====
let cameraPeer = null;
let cameraConnectedRoomId = null;

// ===== 配信品質（#63） =====
// MAIN の受信側 inbound-rtp（解像度・fps・ビットレート・コーデック・selected ICE candidate pair）+
// CAM から DataConnection で届く qualityLimitationReason（送信側でしか取れない）を合わせて、
// 操作員用パネルに出し、HOST 用に RTDB へも書く。
let camLimit = 'none';
let latestMainQuality = null; // { width, height, fps, kbps, codec, path } （watchQuality の生の出力。limit は camLimit 側を使う）
let lastPublishedQuality = null; // 直前に camera_quality へ書いた record（比較用。ts は無視）
let lastPublishedAt = 0; // 直前に書いた時刻（変化が無くても、HOST の古さ判定用に一定間隔で書き直す）
const mainQualityWatchers = new Set();

function mergedQuality() {
  return latestMainQuality ? Object.assign({}, latestMainQuality, { limit: camLimit }) : null;
}

function renderQualityStatus() {
  const el = document.getElementById('camera-quality-status');
  if (!el) return;
  const q = mergedQuality();
  el.textContent = q && q.width ? ('受信: ' + formatQuality(q)) : '';
}

function watchMainQuality(pc) {
  const stop = watchQuality(pc, 'inbound', q => {
    latestMainQuality = q;
    renderQualityStatus();
  }, { intervalMs: 2000 });
  mainQualityWatchers.add(stop);
}
function stopMainQualityWatchers() {
  mainQualityWatchers.forEach(stop => stop());
  mainQualityWatchers.clear();
}
function resetQuality() {
  stopMainQualityWatchers();
  camLimit = 'none';
  latestMainQuality = null;
  lastPublishedQuality = null;
  lastPublishedAt = 0;
  renderQualityStatus();
}
// 配信が切れた（呼が切れた・camera_room が消えた・ローカルソースに切替）ときに、HOST に古い値を残さない
function clearQuality() {
  resetQuality();
  remove(ref(db, 'camera_quality'));
}

// MAIN 自身がリロード・クラッシュした場合に備えて、接続が上がるたびに「切れたら camera_quality を消す」を登録し直す
// （onDisconnect は再接続ごとに再登録が必要。.info/connected は db 初期化後の onValue で監視する）
function registerQualityDisconnectCleanup() {
  onDisconnect(ref(db, 'camera_quality')).remove().catch(() => {});
}

// 変化したとき、または前回の書き込みから一定時間（heartbeat）が経ったときだけ HOST 用に書く。
// heartbeat が無いと「値が変わらない = 何も書かない」ため、HOST 側で ts の古さから切断を判定できない
setInterval(() => {
  const record = toQualityRecord(mergedQuality(), Date.now());
  if (!record) return;
  const changed = !lastPublishedQuality || !qualityRecordEquals(lastPublishedQuality, record);
  const heartbeatDue = Date.now() - lastPublishedAt >= 10000;
  if (!changed && !heartbeatDue) return;
  lastPublishedQuality = record;
  lastPublishedAt = Date.now();
  // ts はサーバー時刻で書く（MAIN / HOST のクライアント時計のズレに関係なく HOST 側で古さを判定できるように）
  set(ref(db, 'camera_quality'), Object.assign({}, record, { ts: { '.sv': 'timestamp' } }));
}, 5000);

// PeerJS の call は peerConnection が後から生えることがあるので、複数のタイミングで拾う（CAM 側の hookCall と同じ考え方）。
// 状態監視自体は watchConnectionState（webrtc-stats.js）に任せる。単純な { once: true } は使わない
// （connecting → connected の間に他の状態を経由することがあり、1 回目で外れると connected を一生観測できなくなる。#94 の回帰）。
function hookMainCall(call) {
  let watching = false;
  const tryStart = () => {
    if (watching) return;
    const pc = call.peerConnection;
    if (!pc) return;
    watching = true;
    watchConnectionState(pc, {
      onConnected: () => watchMainQuality(pc),
      onDisconnected: () => clearQuality(), // 配信が切れたら HOST に古い値を残さない
    });
  };
  tryStart();
  call.on('stream', tryStart);
}
// ===== 配信品質 ここまで =====

function connectCamera(roomId) {
  if (cameraConnectedRoomId === roomId) return; // すでに接続済み
  if (cameraPeer) { try { cameraPeer.destroy(); } catch(e) {} }
  cameraConnectedRoomId = roomId;
  resetQuality();

  cameraPeer = new Peer();
  cameraPeer.on('open', myId => {
    const dc = cameraPeer.connect('ippon-host-' + roomId);
    dc.on('open', () => dc.send('join:' + myId));
    dc.on('data', msg => {
      // CAM から届く配信品質の制限理由（{ type: 'quality', limit }）。受信側では取れない値なので合成に使う
      if (msg && typeof msg === 'object' && msg.type === 'quality' && msg.limit) {
        camLimit = msg.limit;
        renderQualityStatus();
      }
    });
    dc.on('error', () => { cameraConnectedRoomId = null; });
  });
  cameraPeer.on('call', call => {
    // answer でもコーデック順をそろえ、CAM の送信側が読む開始 / 上限ビットレートを付ける（#61）
    const cam = Object.assign({}, CODEC_DEFAULTS, window.IPPON_CONFIG.camera || {});
    call.answer(undefined, { sdpTransform: sdp => setBitrateHints(preferCodec(sdp, cam.preferredCodec), { startKbps: cam.startBitrate / 1000, maxKbps: cam.maxBitrate / 1000 }) });
    call.on('stream', stream => {
      const v = document.getElementById('camera-video');
      v.srcObject = stream;
    });
    hookMainCall(call);
  });
  cameraPeer.on('error', () => { cameraConnectedRoomId = null; });
}

function disconnectCamera() {
  if (cameraPeer) { try { cameraPeer.destroy(); } catch(e) {} }
  cameraPeer = null; cameraConnectedRoomId = null;
  clearQuality();
}

function showCameraVideo(show) {
  document.getElementById('camera-video').style.display = show ? 'block' : 'none';
}
// ===== PeerJS カメラ受信 ここまで =====

// ===== カメラソース切替（WebRTC / ローカルデバイス）=====
// ローカルデバイス = HDMI キャプチャ・連係カメラ・Web カメラ。Wi‑Fi と WebRTC を通さないので画質が落ちない。
// 設定は localStorage に保存。URL の ?source=local&device=<deviceId> でも指定できる（リハーサル・自動起動用）
const CAM_SOURCE_KEY = 'ippon.cameraSource';
const CAM_DEVICE_KEY = 'ippon.cameraDeviceId';
const urlParams = new URLSearchParams(location.search);
let cameraSource = urlParams.get('source') || localStorage.getItem(CAM_SOURCE_KEY) || 'webrtc';
let cameraDeviceId = urlParams.get('device') || localStorage.getItem(CAM_DEVICE_KEY) || '';
let localStream = null;
let lastCameraRoom = null;

const settingsStatus = (t, ok = true) => {
  const el = document.getElementById('camera-settings-status');
  el.textContent = t; el.style.color = ok ? '#8f8' : '#f88';
};

async function listVideoDevices() {
  const sel = document.getElementById('camera-device');
  const devices = (await navigator.mediaDevices.enumerateDevices()).filter(d => d.kind === 'videoinput');
  sel.innerHTML = '';
  devices.forEach((d, i) => {
    const opt = document.createElement('option');
    opt.value = d.deviceId; opt.textContent = d.label || ('カメラ ' + (i + 1));
    if (d.deviceId === cameraDeviceId) opt.selected = true;
    sel.appendChild(opt);
  });
  if (!devices.length) settingsStatus('映像入力デバイスが見つかりません', false);
  return devices;
}

async function startLocalCamera() {
  stopLocalCamera();
  const v = document.getElementById('camera-video');
  const c = window.IPPON_CONFIG.camera || {};
  const video = { width: { ideal: c.width || 1920 }, height: { ideal: c.height || 1080 }, frameRate: { ideal: c.frameRate || 30 } };
  if (cameraDeviceId) video.deviceId = { exact: cameraDeviceId };
  try {
    localStream = await navigator.mediaDevices.getUserMedia({ video, audio: false });
  } catch(e) {
    if (cameraDeviceId) {  // 保存済みデバイスが抜かれている等。既定デバイスで再試行
      cameraDeviceId = '';
      try { localStream = await navigator.mediaDevices.getUserMedia({ video: { width: video.width, height: video.height }, audio: false }); }
      catch(e2) { settingsStatus('カメラを開けません: ' + e2.name, false); return; }
    } else { settingsStatus('カメラを開けません: ' + e.name, false); return; }
  }
  v.srcObject = localStream;
  const st = localStream.getVideoTracks()[0].getSettings();
  const label = (await listVideoDevices()).find(d => d.deviceId === st.deviceId);
  settingsStatus(`ローカル: ${label ? label.label : ''} ${st.width}×${st.height}`);
}

function stopLocalCamera() {
  if (localStream) localStream.getTracks().forEach(t => t.stop());
  localStream = null;
}

async function applyCameraSource() {
  document.querySelectorAll('input[name="camera-source"]').forEach(r => { r.checked = r.value === cameraSource; });
  document.getElementById('camera-device').disabled = cameraSource !== 'local';
  const v = document.getElementById('camera-video');
  if (cameraSource === 'local') {
    disconnectCamera();
    await startLocalCamera();
  } else {
    stopLocalCamera();
    v.srcObject = null;
    settingsStatus(lastCameraRoom ? 'WebRTC: CAM に接続中' : 'WebRTC: CAM の配信待ち');
    if (lastCameraRoom) connectCamera(lastCameraRoom);
  }
}

document.querySelectorAll('input[name="camera-source"]').forEach(r => r.addEventListener('change', () => {
  cameraSource = r.value;
  localStorage.setItem(CAM_SOURCE_KEY, cameraSource);
  applyCameraSource();
}));
document.getElementById('camera-device').addEventListener('change', e => {
  cameraDeviceId = e.target.value;
  localStorage.setItem(CAM_DEVICE_KEY, cameraDeviceId);
  if (cameraSource === 'local') startLocalCamera();
});
document.getElementById('camera-settings-btn').addEventListener('click', () => {
  // パネルを開いたときにデバイス一覧を更新（ラベルは一度カメラ許可を得ないと空になる）
  if (document.getElementById('camera-settings').classList.contains('open')) listVideoDevices();
});
if (navigator.mediaDevices && navigator.mediaDevices.addEventListener) {
  navigator.mediaDevices.addEventListener('devicechange', () => { if (document.getElementById('camera-settings').classList.contains('open')) listVideoDevices(); });
}
applyCameraSource();
// ===== カメラソース切替 ここまで =====

const images = {
  "taiki": STORAGE_BASE + "mp3_odai%2Fmain_taiki.png?alt=media",
  "odai_1": STORAGE_BASE + "image_question%2Fimage_question1.png?alt=media",
  "odai_2": STORAGE_BASE + "image_question%2Fimage_question2.png?alt=media",
  "odai_3": STORAGE_BASE + "image_question%2Fimage_question3.png?alt=media",
  "odai_4": STORAGE_BASE + "image_question%2Fimage_question4.png?alt=media",
  "odai_5": STORAGE_BASE + "image_question%2Fimage_question5.png?alt=media",
  "odai_6": STORAGE_BASE + "image_question%2Fimage_question6.png?alt=media",
  "main_0": STORAGE_BASE + "scoring_system%2Fmain_0.png?alt=media",
  "main_1": STORAGE_BASE + "scoring_system%2Fmain_1.png?alt=media",
  "main_2": STORAGE_BASE + "scoring_system%2Fmain_2.png?alt=media",
  "main_3": STORAGE_BASE + "scoring_system%2Fmain_3.png?alt=media",
  "main_4": STORAGE_BASE + "scoring_system%2Fmain_4.png?alt=media",
  "main_5": STORAGE_BASE + "scoring_system%2Fmain_5.png?alt=media",
  "main_6": STORAGE_BASE + "scoring_system%2Fmain_6.png?alt=media",
  "kekka_0": STORAGE_BASE + "scoring_system%2Fkekka_0.png?alt=media",
  "kekka_1": STORAGE_BASE + "scoring_system%2Fkekka_1.png?alt=media",
  "kekka_2": STORAGE_BASE + "scoring_system%2Fkekka_2.png?alt=media",
  "kekka_3": STORAGE_BASE + "scoring_system%2Fkekka_3.png?alt=media",
  "kekka_4": STORAGE_BASE + "scoring_system%2Fkekka_4.png?alt=media",
  "kekka_5": STORAGE_BASE + "scoring_system%2Fkekka_5.png?alt=media",
  "kekka_6": STORAGE_BASE + "scoring_system%2Fmain_IPPON.png?alt=media",
};

const firebaseConfig = window.IPPON_CONFIG.firebase;

const PLAYER_IMGS = [
  STORAGE_BASE + 'image_portrait%2Fportrait_player5.png?alt=media',
  STORAGE_BASE + 'image_portrait%2Fportrait_player4.png?alt=media',
  STORAGE_BASE + 'image_portrait%2Fportrait_player3.png?alt=media',
  STORAGE_BASE + 'image_portrait%2Fportrait_player2.png?alt=media',
  STORAGE_BASE + 'image_portrait%2Fportrait_player1.png?alt=media',
  STORAGE_BASE + 'image_question%2Fimage_question6.png?alt=media',
];
window.IpponAssets.register([...Object.values(images), ...PLAYER_IMGS]);
// 回答者の名前は設定画面（admin/）で編集する settings/players から。PLAYER_IMGS と同じく左から回答者 5 → 1
let players = playersFromValue(null).players;
let lastScores = [0, 0, 0, 0, 0];
const STICKS = 10;

function renderScoreboard(scores) {
  lastScores = scores;
  const sbPlayers = Array.from({ length: PLAYER_COUNT }, (_, pi) => players[playerAt(pi) - 1]);
  const sb = document.getElementById('scoreboard');
  sb.innerHTML = `
<div style="width:100%;height:80px;background:#A100FF;display:flex;align-items:center;justify-content:center;flex-shrink:0;"><div style="color:#fff;font-size:52px;font-weight:900;letter-spacing:0.15em;text-align:center;text-shadow: 0 0 10px #fff, 0 0 20px #fff, 0 0 40px #c084fc, 0 0 80px #c084fc;">SONG OGIRI GRAND PRIX</div></div><div class="sb-stage" style="display:flex;flex-direction:row;align-items:flex-start;justify-content:center;gap:40px;width:100%;padding:4px 16px 0;height:904px;overflow:visible;">` + sbPlayers.map((p, pi) => {
    const sc = scores[scoreIndex(playerAt(pi))] || 0;
    const lit = sc % STICKS === 0 && sc > 0 ? STICKS : sc % STICKS;
    const tubes = Array.from({length: STICKS}, (_, i) => `
      <div class="sb-tube-wrap">
        <div class="sb-cap"></div>
        <div class="sb-tube-body ${i < lit ? 'on' : ''}"><span class="sb-tube-label">IPPON</span></div>
        <div class="sb-cap bottom"></div>
      </div>`).join('');
    return `<div class="sb-desk">
      <div class="sb-profile-card">
        <div class="sb-avatar"><img src="${PLAYER_IMGS[pi]}"></div>
        <div class="sb-name" style="color:#000;text-shadow:none;"><div style="font-size:50px;">${escapeHtml(p.last)}</div>${p.first ? '<div style="font-size:50px;">' + escapeHtml(p.first) + '</div>' : ''}</div>
      </div>
      <div class="sb-score">${sc}</div>
      <div class="sb-box" style="position:relative;">
        <div style="position:relative;">
          <div class="sb-box-top"></div>
        </div>
        <div class="sb-tubes-wrap" style="position:relative;">
          <div class="sb-tubes">${tubes}</div>
          ${pi === 0 ? `<svg style="position:absolute;top:0;right:-24px;width:24px;height:304px;overflow:visible;" xmlns="http://www.w3.org/2000/svg"><polygon points="0,-16 24,-14.9930 24,0.3357 0,0" fill="#3a3a48"/><polygon points="0,0 24,0.3357 24,291.5804 0,304" fill="#1a1a22"/></svg>` : ''}
          ${pi === 1 ? `<svg style="position:absolute;top:0;right:-14px;width:14px;height:304px;overflow:visible;" xmlns="http://www.w3.org/2000/svg"><polygon points="0,-16 14,-14.4151 14,0.5283 0,0" fill="#3a3a48"/><polygon points="0,0 14,0.5283 14,284.4528 0,304" fill="#1a1a22"/></svg>` : ''}
          ${pi === 3 ? `<svg style="position:absolute;top:0;left:-14px;width:14px;height:304px;overflow:visible;" xmlns="http://www.w3.org/2000/svg"><polygon points="14,-16 0,-14.4151 0,0.5283 14,0" fill="#3a3a48"/><polygon points="14,0 0,0.5283 0,284.4528 14,304" fill="#1a1a22"/></svg>` : ''}
          ${pi === 4 ? `<svg style="position:absolute;top:0;left:-24px;width:24px;height:304px;overflow:visible;" xmlns="http://www.w3.org/2000/svg"><polygon points="24,-16 0,-14.9930 0,0.3357 24,0" fill="#3a3a48"/><polygon points="24,0 0,0.3357 0,291.5804 24,304" fill="#1a1a22"/></svg>` : ''}
        </div>
      </div>
    </div>`;
  }).join('') + `</div><div style="width:100%;height:80px;background:#A100FF;flex-shrink:0;"></div>`;
}

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

let currentVotes = 0;
let currentRevealed = false;
let currentMode = '';

window.goFullscreen = () => {
  document.documentElement.requestFullscreen();
};
document.addEventListener('fullscreenchange', () => {
  const fs = !!document.fullscreenElement;
  document.getElementById('fullscreen-btn').style.display = fs ? 'none' : '';
  document.getElementById('camera-settings-btn').style.display = fs ? 'none' : '';
  if (fs) document.getElementById('camera-settings').classList.remove('open');
});

let ipponTriggered = false;
// IPPON に必要な票数（設定画面で変更。無ければ 6）。採点フレームは voteStep() で 0〜6 段に割り振る
let threshold = DEFAULT_THRESHOLD;
let imageQueue = [];
let isPlayingImageQueue = false;
let displayedVotes = 0; // キューで表示中の票数

function enqueueImages(fromVotes, toVotes) {
  for (let i = fromVotes + 1; i <= toVotes; i++) {
    imageQueue.push(i);
  }
  if (!isPlayingImageQueue) playNextImage();
}

function playNextImage() {
  if (imageQueue.length === 0) {
    isPlayingImageQueue = false;
    return;
  }
  isPlayingImageQueue = true;
  const votes = imageQueue.shift();
  displayedVotes = votes;
  showVoteImage(votes);
  setTimeout(playNextImage, 150);
}

function showScoreImg(n) {
  document.querySelectorAll('[id^="score-img-"]').forEach(el => el.style.display = 'none');
  const img = document.getElementById('score-img');
  const cached = document.getElementById('score-img-' + n);
  if (cached) {
    img.style.display = 'none';
    cached.style.display = 'block';
  } else {
    if (images['main_' + n]) img.src = images['main_' + n];
    img.style.display = 'block';
  }
}
function showKekkaImg(n) {
  document.querySelectorAll('[id^="kekka-img-"]').forEach(el => el.style.display = 'none');
  const badge = document.getElementById('score-badge');
  const cached = document.getElementById('kekka-img-' + n);
  if (cached) {
    badge.style.display = 'none';
    cached.style.display = 'block';
  } else {
    if (images['kekka_' + n]) badge.src = images['kekka_' + n];
    badge.style.display = 'block';
  }
}
// 結果バッジ（票数）。画像は kekka_0〜5 しか無いので、6 票以上（必要な票数を 7 以上にしたとき）は同じ見た目を SVG で描く。
// kekka-img-6 は IPPON の全画面画像なので票数バッジには使わない
function showCountBadge(n) {
  if (n <= 5) { showKekkaImg(n); return; }
  document.querySelectorAll('[id^="kekka-img-"]').forEach(el => el.style.display = 'none');
  document.getElementById('score-badge').style.display = 'none';
  let el = document.getElementById('kekka-img-count');
  if (!el) {
    el = document.createElement('div');
    el.id = 'kekka-img-count';
    el.style.cssText = 'position:absolute;left:8vw;bottom:13vh;height:40vh;aspect-ratio:1056/1209;display:none;z-index:30;';
    document.body.appendChild(el);
  }
  el.innerHTML = '<svg viewBox="0 0 1056 1209" width="100%" height="100%"><circle cx="513" cy="523" r="262" fill="#f0d3ef" stroke="#55544f" stroke-width="26"/>'
    + '<text x="513" y="533" text-anchor="middle" dominant-baseline="central" font-family="\'Black Han Sans\', sans-serif" font-size="440" fill="#434453">' + Number(n) + '</text></svg>';
  el.style.display = 'block';
}
function hideScoreImg() {
  document.querySelectorAll('[id^="score-img-"]').forEach(el => el.style.display = 'none');
  document.getElementById('score-img').style.display = 'none';
}
function hideKekkaImg() {
  document.querySelectorAll('[id^="kekka-img-"]').forEach(el => el.style.display = 'none');
  document.getElementById('score-badge').style.display = 'none';
}

function showVoteImage(votes) {
  if (ipponTriggered) return;
  if (currentMode === 'scoreboard') return;

  if (votes >= threshold) {
    ipponTriggered = true;
    const agendaImg = document.getElementById('agenda-img');
    const agendaVideo = document.getElementById('agenda-video');
    agendaImg.style.display = 'none'; document.querySelectorAll('.agenda-img-cache').forEach(el => el.style.display = 'none');
    agendaVideo.pause(); agendaVideo.style.display = 'none'; agendaVideo.src = '';
    stopConfetti(document.getElementById('confetti-layer'));
    showKekkaImg(6);
    showCameraVideo(false);
  } else if (currentRevealed) {
    showScoreImg(voteStep(votes, threshold));  // フレーム枠を表示（透過PNGなのでカメラが透ける）
    showCountBadge(votes);
  } else {
    showScoreImg(voteStep(votes, threshold));  // フレーム枠を表示
    hideKekkaImg();
  }
}

function updateUI() {
  if (ipponTriggered) return;
  if (currentMode === 'scoreboard') return;

  if (currentMode === 'saiten') {
    showCameraVideo(true);
    showScoreImg(voteStep(currentVotes, threshold));  // フレーム枠は常に表示
    if (currentRevealed) {
      showCountBadge(currentVotes);
    } else {
      hideKekkaImg();
    }
  } else {
    showCameraVideo(false);
    if (currentRevealed) {
      showScoreImg(voteStep(currentVotes, threshold));
      showCountBadge(currentVotes);
    } else {
      showScoreImg(voteStep(currentVotes, threshold));
      hideKekkaImg();
    }
  }
}

// camera_room監視（ソースが WebRTC のときだけ接続する）
onValue(ref(db, 'camera_room'), (snapshot) => {
  const roomId = snapshot.val();
  const hadRoom = !!lastCameraRoom;
  lastCameraRoom = roomId || null;
  if (roomId && cameraSource === 'webrtc') {
    settingsStatus('WebRTC: CAM に接続中');
    connectCamera(roomId);
  } else if (!roomId && hadRoom && cameraSource === 'webrtc') {
    // CAM が配信を止めた（camera_room が消えた）。HOST に古い配信品質を残さない
    clearQuality();
  }
});

// MAIN 自身のリロード・クラッシュに備えて、DB 接続が（再）確立するたびに
// 「切れたら camera_quality を消す」を登録し直す（onDisconnect は再接続ごとに再登録が必要）
onValue(ref(db, '.info/connected'), (snap) => {
  if (snap.val() === true) registerQualityDisconnectCleanup();
});

onValue(ref(db, 'scores'), (snapshot) => {
  const scores = snapshot.val() || [0,0,0,0,0];
  renderScoreboard(scores);
});

onValue(ref(db, PLAYERS_PATH), (snapshot) => {
  players = playersFromValue(snapshot.val()).players;
  renderScoreboard(lastScores);
});

onValue(ref(db, 'agenda'), (snapshot) => {
  const agendaVideo = document.getElementById('agenda-video');
  const confettiLayer = document.getElementById('confetti-layer');
  const url = snapshot.val();

  // 全agenda-img-*を非表示
  document.querySelectorAll('.agenda-img-cache').forEach(el => el.style.display = 'none');

  if (url) {
    const isVideo = url.includes('.mp4') || url.includes('.webm') || url.includes('.mov');
    stopConfetti(confettiLayer);
    if (isVideo) {
      // 動画: 同じURLなら再利用、違うURLなら新規セット
      if (agendaVideo.getAttribute('src') !== url) {
        agendaVideo.src = url;
      }
      agendaVideo.style.display = 'block';
      agendaVideo.onended = () => remove(ref(db, 'agenda'));
      agendaVideo.play().catch(e => console.error(e));
      // 画像を隠す
      document.querySelectorAll('.agenda-img-cache').forEach(el => el.style.display = 'none');
      document.getElementById('agenda-img').style.display = 'none';
    } else {
      // 画像: 動画映像は隠すが音声は止めない
      agendaVideo.style.display = 'none';
      const cached = document.querySelector('.agenda-img-cache[data-src="' + url + '"]');
      if (cached) {
        cached.style.display = 'block';
      } else {
        const agendaImg = document.getElementById('agenda-img');
        agendaImg.src = url;
        agendaImg.style.display = 'block';
      }
      if (url.includes('winner')) startConfetti(confettiLayer);
    }
  } else {
    // agendaがnullになったとき
    get(ref(db, 'keep_audio')).then(snap => {
      if (snap.val()) {
        // 採点モード切り替えなど: 映像だけ隠して音は継続
        agendaVideo.style.display = 'none';
      } else {
        // 完全停止
        agendaVideo.pause(); agendaVideo.style.display = 'none'; agendaVideo.src = '';
      }
    });
    document.getElementById('agenda-img').style.display = 'none';
    stopConfetti(confettiLayer);
  }
});

onValue(ref(db, 'answer_text'), (snapshot) => {
  const el = document.getElementById('agenda-text');
  const answerEl = document.getElementById('agenda-text-answer');
  const nameEl = document.getElementById('agenda-text-name');
  const val = snapshot.val();
  if (val) {
    try {
      const data = JSON.parse(val);
      answerEl.textContent = data.answer || '';
      nameEl.textContent = data.name || '';
    } catch(e) {
      answerEl.textContent = val;
      nameEl.textContent = '';
    }
    el.style.display = 'block';
  } else {
    el.style.display = 'none';
    answerEl.textContent = '';
    nameEl.textContent = '';
  }
});

function startConfetti(layer) {
  layer.innerHTML = '';
  const colors = ['#FFD700','#FFC200','#FFB800','#FFD000','#FFCA00','#FFE566','#E8A800'];
  for (let i = 0; i < 150; i++) {
    const el = document.createElement('div');
    el.className = 'cp';
    const w = Math.random() * 12 + 7;
    const h = Math.random() * 20 + 10;
    const color = colors[Math.floor(Math.random() * colors.length)];
    const left = Math.random() * 100;
    const dur = Math.random() * 2.5 + 2;
    const swayDur = Math.random() * 1.5 + 1;
    const delay = Math.random() * -5;
    el.style.cssText = `width:${w}px;height:${h}px;background:${color};left:${left}%;animation-duration:${dur}s,${swayDur}s;animation-delay:${delay}s,${delay}s;opacity:${Math.random()*0.5+0.5};`;
    layer.appendChild(el);
  }
  layer.style.display = 'block';
}

function stopConfetti(layer) {
  layer.style.display = 'none';
  layer.innerHTML = '';
}

onValue(ref(db, 'mode'), (snapshot) => {
  const mode = snapshot.val();
  currentMode = mode || '';
  const sb = document.getElementById('scoreboard');
  if (mode === 'scoreboard') {
    sb.classList.add('visible');
    document.getElementById('score-badge').style.display = 'none';
    const agendaImg = document.getElementById('agenda-img');
    const agendaVideo = document.getElementById('agenda-video');
    agendaImg.style.display = 'none'; document.querySelectorAll('.agenda-img-cache').forEach(el => el.style.display = 'none');
    agendaVideo.style.display = 'none'; // 映像は隠すが音声は止めない
    stopConfetti(document.getElementById('confetti-layer'));
  } else if (mode === 'agenda') {
    sb.classList.remove('visible');
    document.getElementById('score-badge').style.display = 'none';
    hideScoreImg();
    document.getElementById('taiki-img').style.display = 'none';
    document.getElementById('odai-img').style.display = 'none'; [1,2,3,4,5,6].forEach(function(n){var el=document.getElementById('odai-img-'+n);if(el)el.style.display='none';});
  } else {
    sb.classList.remove('visible');
    document.getElementById('score-badge').style.display = 'none';
  }
  if (mode === 'saiten') {
    ipponTriggered = false;
    imageQueue = [];
    isPlayingImageQueue = false;
    displayedVotes = 0;
    showCameraVideo(true);
    showScoreImg(0);  // フレーム枠（main_0.png）を表示、透過PNGなのでカメラが透ける
  } else {
    showCameraVideo(false);
  }
});

onValue(ref(db, 'taiki'), (snapshot) => {
  const taikiImg = document.getElementById('taiki-img');
  taikiImg.src = images['taiki'];
  taikiImg.style.display = snapshot.val() ? 'block' : 'none';

let voteDebounceTimer = null;
let latestVoteCount = 0;

onValue(ref(db, 'votes'), (snapshot) => {
  const allVotes = snapshot.val() || {};
  latestVoteCount = Math.min(Object.keys(allVotes).length, threshold);

  clearTimeout(voteDebounceTimer);
  voteDebounceTimer = setTimeout(() => {
    const newVotes = latestVoteCount;
    if (newVotes === 0) {
      currentVotes = 0;
      ipponTriggered = false;
      imageQueue = [];
      isPlayingImageQueue = false;
      displayedVotes = 0;
      updateUI();
    } else if (newVotes > currentVotes) {
      const from = Math.max(currentVotes, displayedVotes);
      currentVotes = newVotes;
      enqueueImages(from, newVotes);
    }
  }, 50);
});

onValue(ref(db, THRESHOLD_PATH), (snapshot) => {
  threshold = thresholdFromValue(snapshot.val());
  updateUI();
});

onValue(ref(db, 'revealed'), (snapshot) => {
  currentRevealed = snapshot.val() || false;
  updateUI();
});
